<!doctype html><html><head><meta charset="utf-8">
<script>
// ?t=<ms since epoch>: freeze the clock DOSBox sees at boot (BIOS tick count -> BASIC TIMER), then let it run from there
(function(){const t=new URLSearchParams(location.search).get("t");if(!t)return;localStorage.setItem("worker","false");const RD=Date,off=+t-RD.now();
class D extends RD{constructor(...a){super(...(a.length?a:[RD.now()+off]));}static now(){return new URLSearchParams(location.search).has("frz")?+t:RD.now()+off;}}window.Date=D;})();
</script>
<link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
<script src="https://v8.js-dos.com/latest/js-dos.js"></script>
<style>html,body{margin:0;height:100%;background:#000}#dos{width:100%;height:100%}</style>
</head><body><div id="dos"></div>
<script>window.dci=null;const bundle=new URLSearchParams(location.search).get('b')||'psi5';
Dos(document.getElementById("dos"),{url:bundle+".jsdos",autoStart:true,kiosk:true,onEvent:(e,ci)=>{if(e==="ci-ready")window.dci=ci;}});</script>
</body></html>
