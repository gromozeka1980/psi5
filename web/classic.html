<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Psi 5 Trading Company</title>
<style>
  :root { --bg: #000; --fg: #aaa; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  /* 320x200 CGA frame shown at 4:3 like on a CRT; integer-ish scaling, no smoothing */
  #screen { width: min(96vw, calc(88vh * 4 / 3)); aspect-ratio: 4 / 3; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
  #status { min-height: 1.4em; padding: 0 16px; text-align: center; }
</style></head>
<body>
<canvas id="screen" width="320" height="200"></canvas>
<div id="status"></div>
<script type="module" src="src/main.js"></script>
</body></html>
